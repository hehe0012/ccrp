[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ccrp"
version = "0.2.0"
description = "Private-by-default reverse proxy for cc-switch routes over SSH."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ccrp contributors" }]
keywords = ["ssh", "reverse-proxy", "tunnel", "cc-switch"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Internet :: Proxy Servers",
]

[project.scripts]
ccrp = "ccrp:main"

[tool.setuptools]
py-modules = ["ccrp"]
